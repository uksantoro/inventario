<style>
/* Layout: header con logo e schede; Inventario = elenco aree + righe; su telefono barra di navigazione in basso e righe come schede */
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bg:#F7F7F8;--surface:#FFFFFF;--fg:#32394C;--muted:#5F6473;--line:#DFE1E6;
  --brand:#0047AB;--brand-fg:#FFFFFF;--navy:#0A4169;--teal:#00B1AA;--soft:#E8EFFA;
  --y:#FFF9A6;--o:#FFD9A3;--r:#FFB4B4;--ok:#0A7F78;--danger:#C2253F;--shadow:0 1px 2px rgba(10,65,105,.08),0 4px 14px rgba(10,65,105,.07);
  --font:"Cera ROB","Cera Pro","Cera","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141E;--surface:#182030;--fg:#E5E9F1;--muted:#9BA5B8;--line:#2A3448;--brand:#4D86E8;--brand-fg:#0B1220;--navy:#8CC4F0;--teal:#2CD0C8;--soft:#1E2A42;
  --y:#4D4A17;--o:#5C3F17;--r:#612228;--ok:#38C9C0;--danger:#FF7B8E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141E;--surface:#182030;--fg:#E5E9F1;--muted:#9BA5B8;--line:#2A3448;--brand:#4D86E8;--brand-fg:#0B1220;--navy:#8CC4F0;--teal:#2CD0C8;--soft:#1E2A42;
  --y:#4D4A17;--o:#5C3F17;--r:#612228;--ok:#38C9C0;--danger:#FF7B8E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media (hover:none) and (pointer:coarse){input,select,textarea{font-size:16px!important}}
.ph img{cursor:zoom-in}
#lb{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.94);overflow:hidden;touch-action:none;display:grid;place-items:center;-webkit-user-select:none;user-select:none}
#lb img{max-width:100vw;max-height:100dvh;object-fit:contain;transform-origin:0 0;will-change:transform;-webkit-user-drag:none;cursor:default}
#lb .lbx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:22px;line-height:1;z-index:2}
#lb .lbh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;opacity:.7;font-size:13px;pointer-events:none}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-block:0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;min-width:0}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:44px;width:44px;border-radius:10px;display:block}
.brand b{display:block;color:var(--brand);font-size:17px;letter-spacing:.02em;line-height:1.1}
.brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:none;padding:9px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.tab:hover{background:var(--soft)}
.tab[aria-selected=true]{background:var(--soft);color:var(--brand)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.badge.o{background:#D97A00}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn:focus-visible,.tab:focus-visible,.area:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.dng{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
/* layout */
main{padding-block:18px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:160px}
input[type=date]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:40px}
.g3r{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:10px}@media (max-width:640px){.g3r{grid-template-columns:minmax(0,1fr)}}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.bar select{width:auto}
.inv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.areas{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);max-height:calc(100vh - 110px);overflow:auto}
.area{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.area:hover{background:var(--soft)}
.area[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.area small{opacity:.75;font-variant-numeric:tabular-nums}
.areasel{display:none}
/* list as grid rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gh,.gr{display:grid;gap:10px;padding:10px 14px;align-items:center}
.gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line)}
.gr{border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:0}
.gr.dis{background:color-mix(in srgb,var(--muted) 16%,transparent)}.gr.dis .art,.gr.dis .cell{color:var(--muted)}
.gr.s1{background:var(--y)}.gr.s2{background:var(--o)}.gr.s3{background:var(--r)}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 0 2px;font-size:12px;color:var(--muted)}.lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:1px solid transparent;border-radius:999px;padding:2px 8px;color:inherit;font:inherit;cursor:pointer}.lg[aria-pressed="true"]{border-color:var(--brand);background:var(--soft);color:var(--fg);font-weight:700}.num b.d0{color:var(--r-t,#c2253f)}.num b.dq{color:var(--muted);font-weight:500}.dst{font-weight:700}.dst.s-ap{color:#a07a00}.dst.s-pa{color:#c25a00}.dst.s-ok{color:var(--ok)}.lg::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--c);border:1px solid color-mix(in srgb,var(--c) 60%,#000)}.gr.prv,.gr.prv.dis{background:color-mix(in srgb,#38b6ff 24%,var(--bg))}.gr.str,.gr.str.prv{background:color-mix(in srgb,#d64545 26%,var(--bg))}.gr.sty,.gr.sty.prv{background:color-mix(in srgb,#f2c200 30%,var(--bg))}.gr.sgr,.gr.sgr.prv{background:color-mix(in srgb,#8a919c 24%,var(--bg))}.gr.sgr .art,.gr.sgr .cell{color:var(--muted)}.fxcard{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;display:grid;gap:10px;margin-bottom:12px}.fxcard h3{margin:0;font-size:16px}.fxbig{font-size:15px}.fxbig b{font-size:34px;font-variant-numeric:tabular-nums;color:var(--brand)}.fxline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px}.stp{display:inline-flex;align-items:center;gap:10px}.stp b{min-width:30px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}.stp .btn{min-width:44px;min-height:40px;font-size:20px}
.chip.pv{background:color-mix(in srgb,#38b6ff 38%,var(--bg));color:var(--fg)}.selchk{accent-color:#1c7ed6}
.gr.ver{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.gr.ver,.gr.ver.dis{background:color-mix(in srgb,#2e9e5b 24%,var(--bg))}.vchk{width:18px;height:18px;margin:0 8px 0 0;vertical-align:-3px;accent-color:#2e9e5b;cursor:pointer}
.cols-inv{grid-template-columns:minmax(0,1.8fr) minmax(0,.9fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 52px 52px 52px 52px 52px minmax(0,1.3fr) 284px}
.gh>div{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.subar{display:none}
.srt{cursor:pointer;user-select:none;-webkit-user-select:none}.srt:hover{color:var(--fg)}.srt i{font-style:normal;margin-left:4px;color:var(--brand)}
.mvs{display:none}
.cols-inv .acts{flex-wrap:nowrap}
.cols-acq{grid-template-columns:70px minmax(0,2.2fr) minmax(0,1.2fr) 56px 56px minmax(0,1.6fr) 110px 232px}
.cols-rie{grid-template-columns:minmax(0,2.4fr) 70px 56px 80px 60px 60px 60px minmax(0,2fr)}
.num{text-align:center;font-variant-numeric:tabular-nums}
.art{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--soft);color:var(--brand);font-weight:600}
.chip.r{background:var(--r);color:var(--fg)}.chip.o{background:var(--o);color:var(--fg)}.chip.y{background:var(--y);color:var(--fg)}.chip.g{background:var(--soft);color:var(--ok)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.sum{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px}
.sum b{color:var(--fg);font-variant-numeric:tabular-nums}
.sum2{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin-bottom:10px}.sum2 b{color:var(--fg);font-variant-numeric:tabular-nums}
.cols-int{grid-template-columns:96px minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,.9fr) 100px minmax(0,1.6fr) 170px}
.oggi{display:grid;gap:8px}.avv{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;color:var(--fg)}.avv:hover{background:var(--soft)}
.gres{display:grid;gap:4px;max-height:55vh;overflow:auto}.gri{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 2px;font:inherit;color:var(--fg);cursor:pointer}.gri:hover{background:var(--soft)}
.cols-mov{grid-template-columns:90px minmax(0,1.2fr) minmax(0,1.8fr) 110px minmax(0,.8fr) 52px 90px}
.sem{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25),0 0 0 2px color-mix(in srgb,var(--c) 35%,transparent);vertical-align:middle}
.semb{background:none;border:0;padding:4px;cursor:pointer;border-radius:99px}
.chips .fchip .sem{width:14px;height:14px}
.bcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:2px}.bc b{font-size:20px;font-variant-numeric:tabular-nums}.bc.neg b{color:var(--danger)}
.bbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:12px}.bbar i{display:block;height:100%}
.bfil{flex-wrap:wrap;gap:8px}.bfil label{display:flex;gap:6px;align-items:center;flex:1 1 150px}.bfil input[type=date]{min-width:0;flex:1}
.sc{display:inline-flex;gap:5px;align-items:center}.sc .sem{width:14px;height:14px}
.pieBox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.pieRow{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:10px}.pie{width:200px;height:200px;max-width:100%;flex:none}
.pieLeg{flex:1 1 220px;min-width:0;display:grid;gap:5px}.pieLeg>div{display:grid;grid-template-columns:14px minmax(0,1fr) auto 52px;gap:8px;align-items:center}.pieLeg i{width:12px;height:12px;border-radius:3px}.pieLeg .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pieLeg .sub{text-align:right}
/* controlli */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.fchip[aria-pressed=true]{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;box-shadow:var(--shadow)}
.card.s3{border-left-color:#E5484D}.card.s2{border-left-color:#F08C00}.card.s1{border-left-color:#E5C800}
.card h3{font-size:15px;overflow-wrap:anywhere}
.card .todo{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.card .todo b{color:var(--navy)}
/* dialog */
dialog{border:0;padding:0;border-radius:14px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,40,.5)}
.dform{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dform header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dform header h2{font-size:18px;color:var(--brand)}

    if (q) { const T = q.split(" ").filter(Boolean); R = R.filter(x => { const h = norm([x.articolo, x.area, x.marca, x.modello, x.origine].join(" ")); return T.every(t => h.includes(t)); }); }

/* --- unisci articoli simili --- */
const provDi = r => r.rip ? r.rip.map(x => ({ o: x.o, q: n0(x.q) })) : (r.origine ? [{ o: r.origine, q: n0(r.qty) }] : []);
const ignUni = () => { try { return new Set(JSON.parse(localStorage.getItem("sl_ign_uni") || "[]")); } catch (e) { return new Set(); } };
const salvaIgnUni = set => { try { localStorage.setItem("sl_ign_uni", JSON.stringify([...set])); } catch (e) {} };
const tokOrd = s => norm(s).replace(/[^a-z0-9à-ÿ ]/g, " ").split(" ").filter(Boolean).sort().join(" ");
/* somiglianza tra due righe: 0 = diverse; 1 = stesso nome; .97 = stesse parole; altrimenti nomi molto simili.
   Non sono mai simili se hanno marca o modello diversi, o numeri diversi nel nome (es. 230w / 330w). */
const cifre = s => (norm(s).match(/\d+/g) || []).sort().join(",");
function punteggio(ra, rb) {
  const ma = norm(ra.marca || ""), mb = norm(rb.marca || ""); if (ma && mb && ma !== mb) return 0;
  const oa = norm(ra.modello || ""), ob = norm(rb.modello || ""); if (oa && ob && oa !== ob) return 0;
  if (cifre(ra.articolo) !== cifre(rb.articolo)) return 0;
  const x = norm(ra.articolo), y = norm(rb.articolo);
  if (x === y) return 1; if (tokOrd(ra.articolo) === tokOrd(rb.articolo)) return .97;
  if (Math.min(x.length, y.length) >= 5) { const s = sim(ra.articolo, rb.articolo); if (s >= .85) return s; }
  return 0;
}
/* gruppi «a legame completo»: una riga entra in un gruppo solo se è simile a TUTTE quelle già presenti (niente catene A~B~C) */
function raggruppa(rows) {
  const cl = [], big = rows.length > 400, idx = new Map(), toks = r => norm(r.articolo).split(/[^a-z0-9à-ÿ]+/).filter(w => w.length >= 3);
  rows.slice().sort((a, b) => norm(a.articolo).localeCompare(norm(b.articolo)) || a.id - b.id).forEach(r => {
    const tk = big ? toks(r) : null;
    const cand = big ? [...new Set(tk.flatMap(w => [...(idx.get(w) || [])]))].map(i => cl[i]) : cl;   // su molte righe si confrontano solo i gruppi con almeno una parola in comune
    let best = null, bs = 0;
    for (const c of cand) { let mn = 1; for (const m of c.rows) { const s = punteggio(r, m); if (!s) { mn = 0; break; } mn = Math.min(mn, s); } if (mn > bs) { bs = mn; best = c; } }
    if (best) { best.rows.push(r); best.min = Math.min(best.min, bs); } else { best = { rows: [r], min: 1, i: cl.length }; cl.push(best); }
    if (big) tk.forEach(w => (idx.get(w) || idx.set(w, new Set()).get(w)).add(best.i));
  });
  return cl.filter(c => c.rows.length > 1);
}
const nomiOrd = rows => { const m = new Map(); rows.forEach(r => { const o = m.get(r.articolo) || { n: 0, q: 0 }; o.n++; o.q += n0(r.qty); m.set(r.articolo, o); }); return [...m].sort((a, b) => b[1].n - a[1].n || b[1].q - a[1].q).map(x => x[0]); };
/* righe della stessa area con nome uguale o molto simile */
const uiU = { cross: false };
function gruppiSimili(tutti, cross) {
  const ign = tutti ? new Set() : ignUni(), perArea = new Map(), out = [];
  S.inv.forEach(r => { const a = cross ? "" : (r.area || ""); (perArea.get(a) || perArea.set(a, []).get(a)).push(r); });
  for (const [area, rows] of perArea) for (const c of raggruppa(rows)) {
    const key = c.rows.map(r => r.id).sort((a, b) => a - b).join("-"), aree = [...new Set(c.rows.map(r => r.area || ""))];
    if (!ign.has(key)) out.push({ key, area: aree.length > 1 ? "più aree" : aree[0], multi: aree.length > 1, rows: c.rows.sort((a, b) => n0(b.qty) - n0(a.qty)), sicuro: c.min >= .97 });
  }
  return out.sort((a, b) => (b.sicuro - a.sicuro) || a.area.localeCompare(b.area, "it") || a.rows[0].articolo.localeCompare(b.rows[0].articolo, "it"));
}

    <div class="f"><span class="lab">Risultato</span><div><b>${tot} pz</b> in totale (con la somma suggerita)</div><div class="un"><div class="r">${[...agg].map(([o, q]) => `<span class="chip">${esc(o)} · ${q}</span>`).join("")}${tot > ass ? `<span class="chip y">senza Einkauf · ${tot - ass}</span>` : ""}${!agg.size ? '<span class="sub">Nessun Einkauf indicato</span>' : ""}</div></div></div>`,

function dlgUnisciSicuri() {
  const G = gruppiSimili().filter(g => g.sicuro && !g.multi); if (!G.length) return toast("Nessun gruppo sicuro da unire.");
  dlgConferma("Unisci tutti i sicuri", `Unire <b>${G.length}</b> gruppi con nome identico (${G.reduce((t, g) => t + g.rows.length, 0)} righe)? Per ogni gruppo si somma la quantità e si tiene il nome più usato. Puoi annullare tutto con «Annulla».`, "Sì, unisci", () => {

function unisciRighe(ids, nome, totale, area) {
  const rows = ids.map(invRow).filter(Boolean);
  if (rows.length < 2) throw new Err("Servono almeno due righe da unire.");
  const target = rows.slice().sort((a, b) => n0(b.qty) - n0(a.qty))[0], agg = [];
  rows.forEach(r => provDi(r).forEach(x => { const f = agg.find(y => y.o === x.o); if (f) f.q += x.q; else agg.push({ o: x.o, q: x.q }); }));
  const somma = k => rows.reduce((t, r) => t + n0(r[k]), 0), nomiVecchi = rows.map(r => r.articolo);
  const note = [...new Set(rows.map(r => r.note).filter(Boolean))].join(" · ") || null;
  const marca = (rows.find(r => r.marca) || {}).marca || null, modello = (rows.find(r => r.modello) || {}).modello || null;
  S.acq = S.acq.filter(a => !(a.man && ids.includes(a.inv_id)));
  S.acq.forEach(a => { if (ids.includes(a.inv_id)) a.inv_id = target.id; });
  S.inv = S.inv.filter(r => r === target || !ids.includes(r.id));
  const qtot = totale != null ? totale : somma("qty");
  let rem = agg.reduce((t, x) => t + x.q, 0) - qtot;
  for (let i = agg.length - 1; i >= 0 && rem > 0; i--) { const d = Math.min(agg[i].q, rem); agg[i].q -= d; rem -= d; }
  for (let i = agg.length - 1; i >= 0; i--) if (agg[i].q <= 0) agg.splice(i, 1);
  const grpU = (rows.find(r => r.grp != null) || {}).grp; if (grpU != null) target.grp = grpU;
  const rv = rows.find(r => r.ver); if (rv) target.ver = rv.ver; const rpv = rows.find(r => r.prova); if (rpv) target.prova = rpv.prova;
  const rr = rows.find(r => r.rf || r.rd || r.rn); if (rr) { if (rr.rf) target.rf = rr.rf; if (rr.rd) target.rd = rr.rd; if (rr.rn) target.rn = rr.rn; }
  Object.assign(target, { articolo: nome, qty: qtot, rotto: nz(somma("rotto")), ripar: nz(somma("ripar")), dismesso: nz(somma("dismesso")), note, marca, modello });
  if (area != null) target.area = area || null;
  setOrigini(target, agg); clampStati(target); sincAcq(target);
  nomiVecchi.forEach(n => migraFoto(n, nome));
}

/* --- batterie --- */
const TIPI_B = ["9V", "AAA", "AA"], SOGLIE0 = { "9V": 10, AAA: 20, AA: 20 };
const ui3 = { bt: "", qb: "", sh: "", qs: "" };
const Batt = {
  mov: [], soglie: { ...SOGLIE0 }, ok: false, err: "", lk: "sl_batt",
  loc() { try { const d = JSON.parse(localStorage.getItem(this.lk)); if (d && Array.isArray(d.mov)) return d; } catch (e) {} return { mov: [], soglie: { ...SOGLIE0 }, seq: 0 }; },
  salvaLoc(d) { try { localStorage.setItem(this.lk, JSON.stringify(d)); } catch (e) {} },
  async carica() {
    try {
      if (Repo.mode === "cloud") { const r = await Repo.call("GET", null, "?batt=1"); this.mov = r.mov || []; this.soglie = { ...SOGLIE0, ...(r.soglie || {}) }; }
      else { const d = this.loc(); this.mov = d.mov; this.soglie = { ...SOGLIE0, ...d.soglie }; }
      this.ok = true; this.err = "";
    } catch (e) { this.ok = false; this.err = e.message || "Batterie non disponibili."; }
  },
  async aggiungi(m) {
    if (Repo.mode === "cloud") { await Repo.call("POST", { mov: { ...m, u: Reg.nome() } }, "?batt=1"); await this.carica(); return; }
    const d = this.loc(), g = d.mov.filter(x => x.tipo === m.tipo).reduce((t, x) => t + (x.az === "carico" ? x.q : -x.q), 0);
    if (m.az === "prelievo" && g < m.q) throw new Err("Giacenza insufficiente: di " + m.tipo + " ce ne sono " + g + ".");
    d.seq = (d.seq || 0) + 1; d.mov.push({ id: d.seq, data: m.data, tipo: m.tipo, az: m.az, q: m.q, note: m.note, u: Reg.nome(), t: new Date().toISOString() });
    this.salvaLoc(d); await this.carica();
  },
  async elimina(id) {
    if (Repo.mode === "cloud") { await Repo.call("POST", { del: id }, "?batt=1"); await this.carica(); return; }
    const d = this.loc(); d.mov = d.mov.filter(x => x.id !== id); this.salvaLoc(d); await this.carica();
  },
  async salvaSoglie(s) {
    if (Repo.mode === "cloud") { await Repo.call("POST", { soglie: s }, "?batt=1"); await this.carica(); return; }
    const d = this.loc(); d.soglie = s; this.salvaLoc(d); await this.carica();
  }
};
/* movimenti in ordine, con giacenza prima e residua dopo ogni operazione */
function battRighe(movs) {
  const run = {}, rows = [];
  for (const m of movs || Batt.mov) { const g = run[m.tipo] || 0, r = m.az === "carico" ? g + m.q : g - m.q; run[m.tipo] = r; rows.push({ ...m, giac: g, res: r }); }

const Show = {
  lista: [], ok: false, err: "", cache: new Map(),
  async idbLista() { return (await Img.tx("readonly", s => s.get("show_meta"))) || []; },
  async carica() {
    try {
      if (Repo.mode === "cloud") this.lista = (await Repo.call("GET", null, "?show=1")).lista || [];
      else this.lista = (await this.idbLista()).slice().sort((a, b) => b.id - a.id);
      this.ok = true; this.err = "";
    } catch (e) { this.ok = false; this.err = e.message || "Archivio non disponibile."; }
  },
  async aggiungi(m, dati, thumb) {
    if (Repo.mode === "cloud") { await Repo.call("POST", { ...m, u: Reg.nome(), dati, thumb }, "?show=1"); return; }
    const L = await this.idbLista(), id = L.reduce((t, x) => Math.max(t, x.id), 0) + 1;
    L.push({ id, t: new Date().toISOString(), titolo: m.titolo, show: m.show, note: m.note, u: Reg.nome(), thumb });
    await Img.tx("readwrite", s => s.put(dati, "show:" + id)); await Img.tx("readwrite", s => s.put(L, "show_meta"));
  },
  async modifica(id, m) {
    if (Repo.mode === "cloud") { await Repo.call("POST", { id, ...m }, "?show=1"); return; }
    const L = await this.idbLista(), x = L.find(y => y.id === id); if (x) Object.assign(x, m); await Img.tx("readwrite", s => s.put(L, "show_meta"));
  },
  async elimina(id) {

    else { const L = (await this.idbLista()).filter(y => y.id !== id); await Img.tx("readwrite", s => s.put(L, "show_meta")); await Img.tx("readwrite", s => s.delete("show:" + id)); }
    this.cache.delete(id);
  },
  async dati(id) {
    if (this.cache.has(id)) return this.cache.get(id);
    const d = Repo.mode === "cloud" ? (await Repo.call("GET", null, "?show=1&id=" + id)).dati : await Img.tx("readonly", s => s.get("show:" + id));
    if (d) this.cache.set(id, d); return d || null;
  }
};

function apriFoto(src) {
  closeFoto();

  const lb = document.createElement("div"); lb.id = "lb";
  lb.innerHTML = `<img alt="" draggable="false"><button type="button" class="lbx" aria-label="Chiudi">✕</button><div class="lbh">Pizzica o tocca due volte per ingrandire</div>`;
  const im = lb.querySelector("img"); im.src = src; host.appendChild(lb);
  let sc = 1, tx = 0, ty = 0;
  const ap = () => { im.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`; };
  // trasformazione centrata sull'immagine: calcolo semplice e robusto
  const base = () => { const r = im.getBoundingClientRect(); return { cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; };
  let pts = new Map(), d0 = 0, sc0 = 1, last = null, tap = 0;
  im.style.transformOrigin = "50% 50%";
  const setZoom = (ns, fx, fy) => { ns = Math.min(6, Math.max(1, ns)); const b = base(); const k = ns / sc; tx = (fx - (b.cx - tx)) * (1 - k) + tx * k + 0; ty = (fy - (b.cy - ty)) * (1 - k) + ty * k; sc = ns; lim2(); ap(); };
  const lim2 = () => { if (sc <= 1.001) { sc = 1; tx = 0; ty = 0; return; } const W = lb.clientWidth, H = lb.clientHeight, w = im.clientWidth * sc, h = im.clientHeight * sc; const mx = Math.max(0, (w - W) / 2), my = Math.max(0, (h - H) / 2); tx = Math.min(mx, Math.max(-mx, tx)); ty = Math.min(my, Math.max(-my, ty)); };
  lb.addEventListener("pointerdown", e => { if (e.target.closest(".lbx")) return; lb.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b2] = [...pts.values()]; d0 = Math.hypot(a.x - b2.x, a.y - b2.y); sc0 = sc; } last = { x: e.clientX, y: e.clientY }; });
  lb.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return; const p = pts.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2) { const [a, b2] = [...pts.values()]; const d = Math.hypot(a.x - b2.x, a.y - b2.y); if (d0) setZoom(sc0 * d / d0, (a.x + b2.x) / 2, (a.y + b2.y) / 2); }
    else if (sc > 1) { tx += dx; ty += dy; lim2(); ap(); }
  });
  const fine = e => { const had = pts.has(e.pointerId); pts.delete(e.pointerId); if (pts.size < 2) d0 = 0;
    if (had && e.type === "pointerup" && last && Math.hypot(e.clientX - last.x, e.clientY - last.y) < 8) { const n = Date.now(); if (n - tap < 320) { tap = 0; if (sc > 1) setZoom(1, e.clientX, e.clientY); else setZoom(2.5, e.clientX, e.clientY); } else tap = n; } };
  lb.addEventListener("pointerup", fine); lb.addEventListener("pointercancel", fine);
  lb.addEventListener("wheel", e => { e.preventDefault(); setZoom(sc * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY); }, { passive: false });
  lb.querySelector(".lbx").onclick = e => { e.stopPropagation(); closeFoto(); };

/* calcolo: usa prima le piccole, poi apre le grandi (quello che avanza in una busta aperta diventa "piccole") */
function fxCalc(n) {
  let g = ni(S.fx.sk.g), p = ni(S.fx.sk.p); if (n > g * 4 + p) return null;
  const up = Math.min(p, n); let r = n - up, ug = Math.ceil(r / 4), resto = ug * 4 - r;
  return { g: ug, p: up, resto, nuovoG: g - ug, nuovoP: p - up + resto };
}
function fxScala(n) { const c = fxCalc(n); if (!c) throw new Err("Non bastano le bustine."); S.fx.sk.g = c.nuovoG; S.fx.sk.p = c.nuovoP; S.fx.sk.s = Math.max(0, ni(S.fx.sk.s) - n); }

}

      const sceglie = async ev => { const f = ev.target.files[0]; ev.target.value = ""; if (!f) return; try { nuova = await comprimi(f, 1800, 0.82); for (const [mx, q] of [[1400, 0.7], [1100, 0.6], [900, 0.5]]) { if (nuova.length <= 850000) break; nuova = await comprimi(f, mx, q); } if (nuova.length > 880000) throw new Err("Foto troppo pesante: provane una più piccola."); togli = false; mostra(nuova); } catch (e) { $("#derr", d).textContent = e.message || "Foto non valida."; } };
      $("#mGal", d).onclick = () => $("#mF1", d).click(); $("#mCam", d).onclick = () => $("#mF2", d).click();
      $("#mF1", d).onchange = sceglie; $("#mF2", d).onchange = sceglie;
      del.onclick = () => { nuova = null; togli = true; mostra(null); };
    },
    onOk: d => {
      const data = $("#mD", d).value, imp = numIt($("#mI", d).value);
      if (!data) throw new Err("Inserisci la data."); if (!Number.isFinite(imp) || imp < 0) throw new Err("Inserisci un importo valido (es. 125,50).");
      const o = { data, imp: Math.round(imp * 100) / 100, forn: $("#mF", d).value.trim(), art: $("#mA", d).value.trim(), ddt: $("#mN", d).value.trim(), note: $("#mO", d).value.trim() };
      const mid = id || S.bud.mov.reduce((x, y) => Math.max(x, y.id || 0), 0) + 1, k = "ddt:" + mid;
      $("#dok", d).disabled = true;
      (async () => {
        try {
          if (nuova) await Img.set(k, nuova); else if (togli && m.foto) await Img.del(k);
          go(() => {
            const foto = nuova ? true : togli ? false : !!m.foto;
            if (id) Object.assign(S.bud.mov.find(x => x.id === id), o, { foto: foto || undefined }); else S.bud.mov.push({ id: mid, ...o, foto: foto || undefined });
            if (nuova) { if (!S.imgs.includes(k)) S.imgs.push(k); S.imgv[k] = Date.now(); } else if (togli) { S.imgs = S.imgs.filter(x => x !== k); delete S.imgv[k]; }
            if (o.forn && !S.bud.forn.includes(o.forn)) S.bud.forn.push(o.forn);
            if (S.bud.anni[String(movAnno(o))] == null && movAnno(o)) { /* nessun budget: resta vuoto */ }
          }, "Movimento salvato.");
          d.close();
        } catch (e) { $("#derr", d).textContent = e.message || "Salvataggio non riuscito."; $("#dok", d).disabled = false; }
      })();
      return false;
    }
  });
}
function eliminaMov(id) {
  const m = S.bud.mov.find(x => x.id === id); if (!m) return; const k = "ddt:" + id;
  dlgConferma("Elimina movimento", `Eliminare il movimento del ${dataIt(m.data)} · ${esc(m.forn || "")} · <b>${eur(m.imp)}</b>?`, "Elimina", () => {
    if (m.foto) Img.del(k).catch(() => {});
    go(() => { S.bud.mov = S.bud.mov.filter(x => x.id !== id); S.imgs = S.imgs.filter(x => x !== k); delete S.imgv[k]; }, "Eliminato.");
  });
}
function dlgBudImp() {

  dlg("Budget annuale", `<div class="hint">Importo che ti viene dato da spendere in un anno.</div><div class="g2"><div class="f"><label for="yA">Anno</label><input type="text" id="yA" type="number" min="2000" max="2100" value="${esc(cur)}"></div><div class="f"><label for="yI">Importo (€)</label><input type="text" id="yI" inputmode="decimal" value="${S.bud.anni[cur] != null ? String(S.bud.anni[cur]).replace(".", ",") : ""}" autocomplete="off"></div></div>
   <div class="lab">Già impostati</div>${Object.keys(S.bud.anni).sort((a, b) => b - a).map(a => `<div class="ar"><span>${a}</span><b>${eur(S.bud.anni[a])}</b></div>`).join("") || `<div class="sub">Nessuno.</div>`}`, {

function dlgBudForn() {

   <div id="fLst">${L.map(f => `<div class="ar"><span>${esc(f)} <span class="sub">· ${usati(f)} movimenti</span></span><span class="acts"><button type="button" class="btn sm" data-r="${esc(f)}">Rinomina</button>${usati(f) ? "" : `<button type="button" class="btn sm dng" data-d="${esc(f)}">Elimina</button>`}</span></div>`).join("") || `<div class="sub">Nessun fornitore.</div>`}</div>`, {

        });

const LAY = {
  inv: { cls: "cols-inv", keys: ["articolo","area","marca","modello","origine","qty","disp","rotto","ripar","dismesso","note"], fixed: 1,
         w: ["minmax(0,1.8fr)","minmax(0,.9fr)","minmax(0,1fr)","minmax(0,1fr)","minmax(0,1.1fr)","52px","52px","52px","52px","52px","minmax(0,1.3fr)","284px"] },
  acq: { cls: "cols-acq", keys: ["anno","articolo","area","qty","disp","note"], fixed: 2,
         w: ["70px","minmax(0,2.2fr)","minmax(0,1.2fr)","56px","56px","minmax(0,1.6fr)","110px","232px"] },
  rie: { cls: "cols-rie", keys: ["articolo","totale","disp","acquistati","rotti","ripar","dismessi","dove"], fixed: 0,
         w: ["minmax(0,2.4fr)","70px","56px","80px","60px","60px","60px","minmax(0,2fr)"] }
};
function ordineLay(tab) {
  const L = LAY[tab], saved = S && S.layout && Array.isArray(S.layout[tab]) ? S.layout[tab] : null; if (!saved) return null;
  const o = []; saved.forEach(k => { const i = L.keys.indexOf(k); if (i >= 0 && !o.includes(i)) o.push(i); });
  L.keys.forEach((k, i) => { if (!o.includes(i)) o.push(i); });
  return o.every((v, i) => v === i) ? null : o;
}
function applicaLayout() {
  const largo = window.matchMedia("(min-width:901px)").matches;
  Object.keys(LAY).forEach(tab => {
    const L = LAY[tab], o = largo ? ordineLay(tab) : null;
    document.querySelectorAll("." + L.cls).forEach(row => {
      const ch = row.children;
      if (!o) { if (row.dataset.lay) { row.style.gridTemplateColumns = ""; [...ch].forEach(c => c.style.order = ""); delete row.dataset.lay; } return; }
      const n = L.keys.length; if (ch.length < n) return;
      o.forEach((idx, pos) => { ch[idx].style.order = pos; });
      for (let i = n; i < ch.length; i++) ch[i].style.order = 99;
      row.style.gridTemplateColumns = o.map(i => L.w[i]).concat(L.w.slice(n)).join(" ");
      row.dataset.lay = "1";
    });
  });
}
let layRaf = 0;
new MutationObserver(() => { cancelAnimationFrame(layRaf); layRaf = requestAnimationFrame(applicaLayout); }).observe(document.body, { childList: true, subtree: true });
window.addEventListener("resize", () => { cancelAnimationFrame(layRaf); layRaf = requestAnimationFrame(applicaLayout); });
