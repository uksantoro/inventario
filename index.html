<style>
/* Layout: header con logo e schede; Inventario = elenco aree + righe; su telefono barra di navigazione in basso e righe come schede */
:root{
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bg:#F7F7F8;--surface:#FFFFFF;--fg:#32394C;--muted:#5F6473;--line:#DFE1E6;
  --brand:#0047AB;--brand-fg:#FFFFFF;--navy:#0A4169;--teal:#00B1AA;--soft:#E8EFFA;
  --y:#FFF9A6;--o:#FFD9A3;--r:#FFB4B4;--ok:#0A7F78;--danger:#C2253F;--shadow:0 1px 2px rgba(10,65,105,.08),0 4px 14px rgba(10,65,105,.07);
  --font:"Cera ROB","Cera Pro","Cera","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141E;--surface:#182030;--fg:#E5E9F1;--muted:#9BA5B8;--line:#2A3448;--brand:#4D86E8;--brand-fg:#0B1220;--navy:#8CC4F0;--teal:#2CD0C8;--soft:#1E2A42;
  --y:#4D4A17;--o:#5C3F17;--r:#612228;--ok:#38C9C0;--danger:#FF7B8E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141E;--surface:#182030;--fg:#E5E9F1;--muted:#9BA5B8;--line:#2A3448;--brand:#4D86E8;--brand-fg:#0B1220;--navy:#8CC4F0;--teal:#2CD0C8;--soft:#1E2A42;
  --y:#4D4A17;--o:#5C3F17;--r:#612228;--ok:#38C9C0;--danger:#FF7B8E;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-block:0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;min-width:0}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) ;padding-inline:max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top .in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:44px;width:44px;border-radius:10px;display:block}
.brand b{display:block;color:var(--brand);font-size:17px;letter-spacing:.02em;line-height:1.1}
.brand span{display:block;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:none;padding:9px 14px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
.tab:hover{background:var(--soft)}
.tab[aria-selected=true]{background:var(--soft);color:var(--brand)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:700}
.badge.o{background:#D97A00}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn:focus-visible,.tab:focus-visible,.area:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.dng{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:default}
/* layout */
main{padding-block:18px 40px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .grow{flex:1;min-width:160px}
input[type=text],input[type=number],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.bar select{width:auto}
.inv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.areas{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);max-height:calc(100vh - 110px);overflow:auto}
.area{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;cursor:pointer}
.area:hover{background:var(--soft)}
.area[aria-pressed=true]{background:var(--brand);color:var(--brand-fg);font-weight:700}
.area small{opacity:.75;font-variant-numeric:tabular-nums}
.areasel{display:none}
/* list as grid rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gh,.gr{display:grid;gap:10px;padding:10px 14px;align-items:center}
.gh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line)}
.gr{border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:0}
.gr.s1{background:var(--y)}.gr.s2{background:var(--o)}.gr.s3{background:var(--r)}
.cols-inv{grid-template-columns:minmax(0,1.8fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr) 52px 52px 52px 52px minmax(0,1.3fr) 284px}
.mvs{display:none}
.cols-inv .acts{flex-wrap:nowrap}
.cols-acq{grid-template-columns:70px minmax(0,2.2fr) minmax(0,1.2fr) 56px minmax(0,1.6fr) 110px 232px}
.cols-rie{grid-template-columns:minmax(0,2.4fr) 70px 60px 60px 60px minmax(0,2fr)}
.num{text-align:center;font-variant-numeric:tabular-nums}
.art{font-weight:600;min-width:0;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12.5px;font-weight:400}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--soft);color:var(--brand);font-weight:600}
.chip.r{background:var(--r);color:var(--fg)}.chip.o{background:var(--o);color:var(--fg)}.chip.y{background:var(--y);color:var(--fg)}.chip.g{background:var(--soft);color:var(--ok)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.sum{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:10px}
.sum b{color:var(--fg);font-variant-numeric:tabular-nums}
/* controlli */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;cursor:pointer;font-weight:600;display:flex;gap:8px;align-items:center}
.fchip[aria-pressed=true]{border-color:var(--brand);background:var(--soft);color:var(--brand)}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;box-shadow:var(--shadow)}
.card.s3{border-left-color:#E5484D}.card.s2{border-left-color:#F08C00}.card.s1{border-left-color:#E5C800}
.card h3{font-size:15px;overflow-wrap:anywhere}
.card .todo{grid-column:1/-1;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13.5px}
.card .todo b{color:var(--navy)}
/* dialog */
dialog{border:0;padding:0;border-radius:14px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(760px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,40,.5)}
.dform{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dform header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dform header h2{font-size:18px;color:var(--brand)}
.x{border:0;background:none;font-size:18px;cursor:pointer;color:var(--muted);padding:4px 8px}
.dbody{padding:16px 18px;overflow:auto;display:grid;gap:12px;align-content:start}
.dform footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.derr{color:var(--danger);font-weight:600;min-height:0}
.f{display:grid;gap:4px;min-width:0}
.f label,.lab{font-size:12.5px;color:var(--muted);font-weight:700}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 80px minmax(0,1.3fr) auto;gap:8px;align-items:start}
.hint{font-size:12.5px;color:var(--muted)}
.hint.w{color:#B25E00}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.opt input{margin-top:3px;width:auto}
.menu{display:grid;gap:8px}
.menu .btn{text-align:left;width:100%}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:100;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.3);font-weight:600}
[data-theme=dark] #toast{color:#0B1220}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;gap:16px;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;padding:7px max(16px,env(safe-area-inset-left,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.foot #fTot{font-variant-numeric:tabular-nums}
body{padding-bottom:calc(38px + env(safe-area-inset-bottom,0px))}
.bnav{display:none}
.fab{display:none}
/* tablet / phone */
@media (max-width:900px){
  .cols-inv{grid-template-columns:minmax(0,2fr) 48px 48px 48px 48px 150px}
  .cols-inv .c-or,.cols-inv .c-no,.cols-inv .c-ma,.cols-inv .c-mo{display:none}
  .mvs{display:inline}
  .cols-inv .c-art .sub.mo{display:block}
}
@media (max-width:760px){
  .foot{display:none}
  /* telefono: la pagina non scorre, scorre solo il contenuto; intestazione e barra in basso restano sempre ferme */
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;box-sizing:border-box;margin:0;padding:0;display:flex;flex-direction:column}
  body::before{display:none}
  .top{position:static;flex:none;margin-inline:0;padding-top:var(--sat);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .wrap{flex:1 1 auto;min-height:0;width:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .bnav{position:static;flex:none;transform:none}
  #toast{position:absolute;bottom:80px}
  .tabs{display:none}
  .brand img{height:38px;width:38px}
  .tools .dsk{display:none}
  .inv{grid-template-columns:minmax(0,1fr)}
  .areas{display:none}
  .areasel{display:block;width:100%}
  .gh{display:none}
  .gr{grid-template-columns:minmax(0,1fr)!important;gap:6px;padding:12px 14px}
  .gr .c-or,.gr .c-no{display:block!important}
  .gr .cell[data-l]::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px;font-weight:700}
  .gr .nums{display:flex;gap:14px;flex-wrap:wrap}
  .gr .num{text-align:left}
  .acts{justify-content:flex-start}
  .gr .c-q{font-size:15px}
  .bnav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:static;flex:none;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + var(--sab)) max(6px,env(safe-area-inset-right,0px))}
  .bnav .tab{flex-direction:column;gap:3px;font-size:10px;font-weight:600;padding:7px 0 6px;min-width:0;position:relative;justify-content:center;align-items:center;letter-spacing:-.01em;white-space:nowrap}
  .bnav .tab svg{width:23px;height:23px;flex:none}
  .bnav .tab span:not(.badge){max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .bnav .badge{position:absolute;top:0;right:18%}
  .fab{display:flex;position:sticky;bottom:14px;margin:0 0 14px auto;z-index:24;border-radius:99px;padding:13px 18px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
  .g2,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:minmax(0,1fr) 80px;padding:10px;border:1px solid var(--line);border-radius:10px}
  .prow>*:nth-child(1){grid-column:1/-1}.prow>*:nth-child(2){grid-column:1/2}.prow>*:nth-child(4){grid-column:1/-1}
  dialog,dialog.wide{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0}
  .dform{max-height:100dvh;height:100dvh}
  .dform header{padding-top:max(14px,env(safe-area-inset-top,0px))}
  .dform footer{padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
  .dbody{flex:1}
  .card{grid-template-columns:minmax(0,1fr)}
  .bar .btn.fl{display:none}
}
@media (min-width:761px) and (max-width:1180px){.tabs{flex-wrap:wrap}.tab{padding:8px 10px;font-size:14px}}
/* batterie e show/live */
.bsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 12px}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px}
.bc .t{font-weight:700;color:var(--muted);letter-spacing:.04em;font-size:12px}
.bc .n{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.bc.low{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 9%,var(--surface))}
.bc.low .n{color:var(--danger)}
.allerta{border:1px solid var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.bt-h,.bt-r{display:grid;grid-template-columns:minmax(0,1.3fr) 80px 100px 100px 100px minmax(0,1.6fr) minmax(0,1fr) 48px;gap:10px;padding:10px 14px;align-items:center}
.bt-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg);border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
.bt-r{border-bottom:1px solid var(--line);background:var(--surface)}
.bt-h .num,.bt-r .num{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:grid;align-content:start}
.sc img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bg);display:block}
.sc .i{padding:8px 10px;display:grid;gap:3px;justify-items:start}
.sc .i b{overflow-wrap:anywhere}
.zv{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px;-webkit-overflow-scrolling:touch}
.zv img{display:block;width:100%;height:auto}
.zv.z2 img{width:200%;max-width:none}.zv.z3 img{width:320%;max-width:none}
@media (max-width:760px){
  .bt-h{display:none}
  .bt-r{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-areas:"t t d" "g p s" "n n n" "c c x";gap:6px 10px;padding:12px 14px}
  .bt-r .bt-t{grid-area:t}.bt-r .bt-d{grid-area:d;text-align:right;color:var(--muted);font-size:13px}
  .bt-r .bt-g{grid-area:g}.bt-r .bt-p{grid-area:p}.bt-r .bt-s{grid-area:s}
  .bt-r .num{text-align:left;font-size:17px}
  .bt-r .cell[data-l]::before{content:attr(data-l);display:block;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .bt-r .bt-n{grid-area:n}.bt-r .bt-n:empty{display:none}.bt-r .bt-c{grid-area:c;color:var(--muted);font-size:13px}.bt-r .bt-x{grid-area:x;justify-self:end}
  .bsum{gap:8px}.bc{padding:10px 10px}.bc .n{font-size:26px}
  .sg{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .bc .sub{font-size:12px}.bc .chip{font-size:11px;padding:1px 7px;margin-top:2px}
}
/* unisci articoli simili */
.un{display:grid;gap:6px;margin:8px 0}
.un .r{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.un .r b{overflow-wrap:anywhere}
.optn{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.optn input{margin-top:3px}
/* registro */
.lg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:4px;margin-bottom:8px}
.lg .m{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.lg .m b{color:var(--fg);font-size:14px}
.lg .t{overflow-wrap:anywhere}
/* dettaglio, foto, provenienza multipla */
.cam{display:inline-block;margin-left:6px;color:var(--teal);vertical-align:-2px}
.cam svg{width:15px;height:15px}
.mq,.mch,.mnote{display:none}
.gr.ri,.gr.ra{cursor:pointer}
.ph{display:grid;place-items:center;min-height:150px;border:1px dashed var(--line);border-radius:12px;background:var(--bg);color:var(--muted);overflow:hidden;text-align:center;padding:10px}
.ph img{display:block;max-width:100%;max-height:46dvh;object-fit:contain;border-radius:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0}
.kv dt{color:var(--muted);font-size:12.5px;font-weight:700;padding-top:1px}
.kv dd{margin:0;overflow-wrap:anywhere}
.dacts{display:flex;flex-wrap:wrap;gap:8px}
.prv{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;margin-bottom:8px;align-items:center}
.prv.one{grid-template-columns:minmax(0,1fr)}
.prv.one .pQ,.prv.one .pX{display:none}
.sum .sh{display:none}
@media (max-width:760px){
  .top .in{flex-wrap:nowrap;gap:8px;padding-block:8px}
  .brand{flex:1}
  .brand img{height:34px}
  .brand b{font-size:14px}
  .brand span{display:none}
  .tools{gap:6px;margin-left:0}
  .tools .tx{display:none}
  .tools .btn{padding:7px 13px;font-size:17px;line-height:1.1}
  main{padding-block:12px 24px}
  .sum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;text-align:center;margin-bottom:10px;padding:8px 4px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
  .sum>span{display:flex;flex-direction:column;font-size:11px;line-height:1.25}
  .sum b{font-size:18px}
  .sum .lg{display:none}.sum .sh{display:inline}
  .gr.ri{grid-template-columns:minmax(0,1fr) auto!important;gap:3px 12px;padding:10px 14px}
  .gr.ri .c-or,.gr.ri .c-no,.gr.ri .c-ma,.gr.ri .c-mo,.gr.ri .nums,.gr.ri .acts{display:none!important}
  .gr.ri .c-art{font-size:15.5px;grid-column:1;grid-row:1}
  .gr.ri .mq{display:block;text-align:right;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;grid-row:1;grid-column:2}
  .gr.ri .mq small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .gr.ri .mch{display:flex;grid-column:1/-1;gap:6px;flex-wrap:wrap;align-items:center}
  .gr.ri .mnote{display:block;grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fab .txt{display:none}
  .fab{width:56px;height:56px;padding:0;justify-content:center;align-items:center;font-size:30px;line-height:1}
  .prv{grid-template-columns:minmax(0,1fr) 76px auto}
  .ph img{max-height:38dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").toLowerCase().replace(/\s+/g, " ").trim();
const n0 = x => Number(x) || 0;
const nz = x => (x ? x : null);
class Err extends Error {}
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
const sim = (a, b) => { a = norm(a); b = norm(b); const L = Math.max(a.length, b.length); return L ? 1 - lev(a, b) / L : 1; };
const nid = arr => arr.reduce((m, x) => Math.max(m, x.id), 0) + 1;
const today = () => new Date().toISOString().slice(0, 10);

  const rot = n0(r.rotto), rip = n0(r.ripar), dis = n0(r.dismesso);
  if (tipo === "rotto") { if (rot + rip + n > r.qty) throw new Err("Rotti + in riparazione supererebbero la quantità."); r.rotto = rot + n; }
  else if (tipo === "ripar") { if (n > rot) throw new Err("Hai solo " + rot + " pezzi rotti da mandare in riparazione."); r.rotto = nz(rot - n); r.ripar = rip + n; }
  else if (tipo === "riparato") { if (n > rip) throw new Err("Hai solo " + rip + " pezzi in riparazione."); r.ripar = nz(rip - n); }
  else if (tipo === "dismesso") { if (n > rot) throw new Err("Hai solo " + rot + " pezzi rotti da dismettere."); if (dis + n > r.qty) throw new Err("I dismessi supererebbero la quantità."); r.rotto = nz(rot - n); r.dismesso = dis + n; }
}

/* aree */
function rinominaArea(vecchia, nuova) {
  nuova = nuova.trim().replace(/\s+/g, " ");
  if (!nuova) throw new Err("Il nome dell'area è vuoto.");
  if (S.aree.some(a => norm(a) === norm(nuova) && a !== vecchia)) throw new Err("Esiste già un'area con questo nome.");
  S.aree = S.aree.map(a => a === vecchia ? nuova : a);
  S.inv.forEach(r => { if (r.area === vecchia) r.area = nuova; }); S.acq.forEach(a => { if (a.area === vecchia) a.area = nuova; });
}
function eliminaArea(area, dest) {
  S.aree = S.aree.filter(a => a !== area);
  S.inv.filter(r => r.area === area).forEach(r => { r.area = dest || null; });
  S.acq.forEach(a => { if (a.area === area) a.area = dest || null; });
  [...S.inv].forEach(r => { if (S.inv.includes(r)) fuse(r); });
}
function muoviArea(i, d) { const j = i + d; if (j < 0 || j >= S.aree.length) return; [S.aree[i], S.aree[j]] = [S.aree[j], S.aree[i]]; }
function aggiungiArea(nome) {
  nome = nome.trim().replace(/\s+/g, " "); if (!nome) throw new Err("Scrivi il nome dell'area.");
  if (S.aree.some(a => norm(a) === norm(nome))) throw new Err("Esiste già un'area con questo nome.");
  S.aree.push(nome);
}

/* collegamenti acquisti ⇄ inventario */
function candidati(a) {
  const org = orgDi(a.anno), res = [];
  for (const r of S.inv) {
    if (!(r.origine === org || (r.rip && r.rip.some(x => x.o === org)))) continue;
    let liv = 0;
    if (norm(r.articolo) === norm(a.articolo) && r.area === a.area) liv = 1;
    else if (norm(r.articolo) === norm(a.articolo)) liv = 2;
    else if (sim(r.articolo, a.articolo) >= 0.6) liv = 3;
    if (liv) res.push({ r, liv, s: sim(r.articolo, a.articolo) });
  }
  return res.sort((x, y) => x.liv - y.liv || y.s - x.s);
}
function collegaTutti() {
  let n = 0;
  for (const a of S.acq) {
    if (a.inv_id != null && invRow(a.inv_id)) continue;
    const c = candidati(a)[0]; if (c) { a.inv_id = c.r.id; n++; }
  }
  return n;
}
function creaRigaDaAcq(a) {
  const r = { id: nid(S.inv), articolo: a.articolo, area: a.area || null, rotto: a.rotto, dismesso: a.dismesso, ripar: a.ripar, note: a.note, qty: n0(a.qty), origine: orgDi(a.anno), ord: nextOrd() };
  S.inv.push(r); a.inv_id = r.id; clampStati(r);
}

/* anomalie */
function anomalie() {
  const L = [];
  const push = o => L.push(o);
  const dup = new Map();
  S.inv.forEach(r => { const k = norm(r.articolo) + "|" + (r.area || "") + "|" + norm(r.origine); (dup.get(k) || dup.set(k, []).get(k)).push(r); });
  for (const r of S.inv) {
    const base = { dove: "inv", id: r.id, articolo: r.articolo, area: r.area, qty: r.qty };
    if (n0(r.rotto) + n0(r.ripar) > n0(r.qty)) push({ ...base, gr: 3, tipo: "ROTTI", testo: "Rotti (" + n0(r.rotto) + ") + in riparazione (" + n0(r.ripar) + ") sono più della quantità (" + n0(r.qty) + ").", sugg: "Correggi la quantità o i pezzi rotti: apri la riga e controlla i numeri." });
    if (n0(r.dismesso) > n0(r.qty)) push({ ...base, gr: 3, tipo: "DISMESSI", testo: "I dismessi (" + n0(r.dismesso) + ") sono più della quantità (" + n0(r.qty) + ").", sugg: "Correggi la quantità o i dismessi." });
    if (r.qty == null) push({ ...base, gr: 2, tipo: "QTA", testo: "Manca la quantità.", sugg: "Apri la riga e inserisci quanti pezzi ci sono." });
    if (!r.area) push({ ...base, gr: 2, tipo: "AREA", testo: "L'articolo non ha un'area.", sugg: "Assegna l'area con «Sposta» o «Modifica»." });
    const g = dup.get(norm(r.articolo) + "|" + (r.area || "") + "|" + norm(r.origine));
    if (g.length > 1) push({ ...base, gr: 1, tipo: "DOPPIA", testo: "Riga doppia: stesso articolo, area e origine compaiono " + g.length + " volte.", sugg: "Usa «Unisci» per sommare le quantità in una sola riga." });
  }
  for (const a of S.acq) {
    const base = { dove: "acq", id: a.id, articolo: a.articolo, area: a.area, qty: a.qty };
    if (a.inv_id == null || !invRow(a.inv_id)) push({ ...base, gr: 2, tipo: "NONCOLL", testo: "Acquisto " + a.anno + " non collegato a una riga di inventario.", sugg: "Usa «Collega» per scegliere la riga in " + orgDi(a.anno) + ", oppure creala." });
    if (!a.area) push({ ...base, gr: 2, tipo: "AREA", testo: "L'acquisto " + a.anno + " non ha un'area.", sugg: "Apri l'acquisto e scegli l'area." });
    const prima = S.acq.find(b => b.anno < a.anno && sim(b.articolo, a.articolo) >= 0.85);
    if (prima) push({ ...base, gr: 1, tipo: "SIMILE", testo: "Acquistato anche nel " + prima.anno + " («" + prima.articolo + "»).", sugg: "Se è un riacquisto va bene. Se il nome è scritto in modo diverso, uniformalo." });
  }
  return L.sort((a, b) => b.gr - a.gr);
}

  <div class="f"><label for="fAr">Area di destinazione</label><select id="fAr">${areaOpts(r.area, "— Da assegnare —")}</select></div>

function leggiRiga(d) {
  const q = intOrNull($("#fQ", d).value);
  const o = { articolo: $("#fA", d).value, marca: $("#fMa", d).value.trim() || null, modello: $("#fMo", d).value.trim() || null, area: $("#fAr", d).value || null,
    origini: [...d.querySelectorAll(".prv")].map(r => ({ o: $(".pO", r).value.trim(), q: intOrNull($(".pQ", r).value) })),
    qty: q, rotto: intOrNull($("#fR", d).value), ripar: intOrNull($("#fP", d).value), dismesso: intOrNull($("#fD", d).value), note: $("#fN", d).value.trim() || null };
  if (q === null || Number.isNaN(q)) throw new Err("Inserisci la quantità (numero intero).");
  return o;
}
function dlgRiga(id) {
  const r = id == null ? { articolo: "", area: ui.area !== "*" && ui.area !== "-" ? ui.area : "", origine: "", qty: 1 } : invRow(id);
  const vecchio = id == null ? null : r.articolo;
  dlg(id == null ? "Nuovo articolo" : "Modifica articolo", formRiga(r), {
    onOk: d => { const o = leggiRiga(d); run(() => { salvaRiga(id, o); migraFoto(vecchio, o.articolo); }, "Salvato."); },
    init: d => {
      pvSync(d);
      $("#pvAdd", d).onclick = () => { $("#pv", d).insertAdjacentHTML("beforeend", pvRowHtml({})); pvSync(d); };

function dlgDettaglio(id) {
  const r = invRow(id); if (!r) return;
  const key = norm(r.articolo), has = S.imgs.includes(key);
  const prov = r.rip ? r.rip.map(x => esc(x.o) + " · " + x.q + " pz").join("<br>") : esc(r.origine || "");
  const kv = (k, v) => v || v === 0 ? `<dt>${k}</dt><dd>${v}</dd>` : "";
  const d = dlg(esc(r.articolo), `<div class="ph" id="phBox">${has ? "Carico la foto…" : "Nessuna foto"}</div>
   <div class="dacts"><button type="button" class="btn sm" id="bFoto">${has ? "Cambia foto" : "Aggiungi foto"}</button>${has ? `<button type="button" class="btn sm dng" id="bFotoDel">Rimuovi foto</button>` : ""}</div>
   <input type="file" id="fImg" accept="image/*" hidden>
   <dl class="kv">${kv("Area", esc(r.area || "Da assegnare"))}${kv("Marca", esc(r.marca))}${kv("Modello", esc(r.modello))}${kv("Quantità", `<b>${r.qty ?? "—"}</b>`)}${kv("Rotti", n0(r.rotto) ? r.rotto : "")}${kv("In riparazione", n0(r.ripar) ? r.ripar : "")}${kv("Dismessi", n0(r.dismesso) ? r.dismesso : "")}${kv("Einkauf", prov)}${kv("Note", esc(r.note))}</dl>
   <div class="dacts"><button type="button" class="btn pri" data-x="edit">Modifica</button><button type="button" class="btn" data-x="move">Sposta</button><button type="button" class="btn" data-x="stato">Stato</button><button type="button" class="btn dng" data-x="del">Elimina</button></div>`, {
    noCancel: true, ok: "Chiudi", onOk: () => {},
    init: d => {
      d.dataset.inv = id;
      if (has) Img.get(key).then(u => { const b = $("#phBox", d); if (!b) return; if (u) { b.innerHTML = `<img alt="">`; b.firstChild.src = u; } else b.textContent = "Foto non disponibile"; }).catch(() => { const b = $("#phBox", d); if (b) b.textContent = "Foto non disponibile"; });
      $("#bFoto", d).onclick = () => $("#fImg", d).click();
      $("#fImg", d).onchange = ev => { const f = ev.target.files[0]; ev.target.value = ""; if (f) salvaFoto(id, f); };
      const del = $("#bFotoDel", d); if (del) del.onclick = () => rimuoviFoto(id);
      d.querySelectorAll("[data-x]").forEach(b => b.onclick = () => {

      });
    }

}
async function salvaFoto(id, file) {
  const r = invRow(id); if (!r) return; const key = norm(r.articolo);
  try {
    const u = await comprimi(file); await Img.set(key, u);
    go(() => { if (!S.imgs.includes(key)) S.imgs.push(key); S.imgv[key] = Date.now(); }, "Foto salvata.");
    dlgDettaglio(id);
  } catch (e) { toast(e instanceof Err ? e.message : "Impossibile salvare la foto."); }
}
async function rimuoviFoto(id) {
  const r = invRow(id); if (!r) return; const key = norm(r.articolo);
  try { await Img.del(key); } catch (e) { toast(e instanceof Err ? e.message : "Impossibile rimuovere la foto."); return; }
  go(() => { S.imgs = S.imgs.filter(k => k !== key); delete S.imgv[key]; }, "Foto rimossa.");
  dlgDettaglio(id);
}
document.addEventListener("paste", e => {
  const d = $("#dlg"); if (!d.open || !d.dataset.inv) return;

  e.preventDefault(); salvaFoto(Number(d.dataset.inv), it.getAsFile());

function viewRie(v) {
  v.innerHTML = `<div class="bar"><input type="search" class="grow" id="qr" placeholder="Cerca articolo…" value="${esc(ui.qr)}" aria-label="Cerca"></div><div id="list"></div>`;
  listRie();

function listRie() {
  const m = new Map();
  S.inv.forEach(r => { const k = norm(r.articolo); const g = m.get(k) || { nome: r.articolo, qty: 0, rotto: 0, ripar: 0, dis: 0, aree: new Map() }; g.qty += n0(r.qty); g.rotto += n0(r.rotto); g.ripar += n0(r.ripar); g.dis += n0(r.dismesso); const a = r.area || "Da assegnare"; g.aree.set(a, (g.aree.get(a) || 0) + n0(r.qty)); m.set(k, g); });
  const q = norm(ui.qr);
  const R = [...m.values()].filter(g => !q || norm(g.nome).includes(q)).sort((a, b) => a.nome.localeCompare(b.nome, "it"));
  $("#list").innerHTML = `<div class="sum"><span><b>${R.length}</b> articoli diversi</span><span><b>${R.reduce((s, g) => s + g.qty, 0)}</b> pezzi</span></div><div class="list">` + (R.length ? `<div class="gh cols-rie"><div>Articolo</div><div class="num">Totale</div><div class="num">Rotti</div><div class="num">Rip.</div><div class="num">Dism.</div><div>Dove si trova</div></div>` + R.map(g => `<div class="gr cols-rie"><div class="art cell"><a href="#" data-act="vedi" data-n="${esc(g.nome)}" style="color:var(--brand);text-decoration:none">${esc(g.nome)}</a></div><div class="num cell" data-l="Totale"><b>${g.qty}</b></div><div class="num cell" data-l="Rotti">${g.rotto || "·"}</div><div class="num cell" data-l="Rip.">${g.ripar || "·"}</div><div class="num cell" data-l="Dism.">${g.dis || "·"}</div><div class="cell">${[...g.aree].map(([a, n]) => `<span class="chip">${esc(a)} · ${n}</span>`).join(" ")}</div></div>`).join("") : `<div class="empty">Nessun articolo.</div>`) + `</div>`;
}

const provDi = r => r.rip ? r.rip.map(x => ({ o: x.o, q: n0(x.q) })) : (r.origine ? [{ o: r.origine, q: n0(r.qty) }] : []);

const tokOrd = s => norm(s).replace(/[^a-z0-9à-ÿ ]/g, " ").split(" ").filter(Boolean).sort().join(" ");
const simili = (a, b) => { const x = norm(a), y = norm(b); return x === y || tokOrd(a) === tokOrd(b) || (Math.min(x.length, y.length) >= 5 && sim(a, b) >= 0.85); };
/* righe della stessa area con nome uguale o molto simile */
function gruppiSimili(tutti) {
  const ign = tutti ? new Set() : ignUni(), perArea = new Map(), out = [];
  S.inv.forEach(r => { const a = r.area || ""; (perArea.get(a) || perArea.set(a, []).get(a)).push(r); });
  for (const [area, rows] of perArea) {
    const pa = rows.map((_, i) => i), trova = i => pa[i] === i ? i : (pa[i] = trova(pa[i]));
    for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) if (simili(rows[i].articolo, rows[j].articolo)) pa[trova(i)] = trova(j);
    const g = new Map(); rows.forEach((r, i) => { const k = trova(i); (g.get(k) || g.set(k, []).get(k)).push(r); });
    for (const L of g.values()) if (L.length > 1) { const key = L.map(r => r.id).sort((a, b) => a - b).join("-"); if (!ign.has(key)) out.push({ key, area, rows: L.sort((a, b) => n0(b.qty) - n0(a.qty)) }); }
  }
  return out.sort((a, b) => a.area.localeCompare(b.area, "it") || a.rows[0].articolo.localeCompare(b.rows[0].articolo, "it"));
}
const provHtml = r => { const P = provDi(r), ass = P.reduce((t, x) => t + x.q, 0); return P.map(x => `<span class="chip">${esc(x.o)} · ${x.q}</span>`).join("") + (n0(r.qty) > ass ? `<span class="chip y">senza Einkauf · ${n0(r.qty) - ass}</span>` : ""); };

}
function dlgUnisci(key) {
  const ids = key.split("-").map(Number), rows = ids.map(invRow).filter(Boolean);

function unisciRighe(ids, nome) {
  const rows = ids.map(invRow).filter(Boolean);

  rows.forEach(r => provDi(r).forEach(x => { const f = agg.find(y => y.o === x.o); if (f) f.q += x.q; else agg.push({ o: x.o, q: x.q }); }));

  S.acq = S.acq.filter(a => !(a.man && ids.includes(a.inv_id)));
  S.acq.forEach(a => { if (ids.includes(a.inv_id)) a.inv_id = target.id; });
  S.inv = S.inv.filter(r => r === target || !ids.includes(r.id));

  setOrigini(target, agg); clampStati(target); sincAcq(target);
  nomiVecchi.forEach(n => migraFoto(n, nome));
}

}
function dlgEsporta() {
  const anni = [...new Set(S.acq.map(a => a.anno))].sort((a, b) => b - a);
  dlg("Esporta in Excel", `<div class="f"><label for="eT">Cosa esportare</label><select id="eT"><option value="inv:*">Inventario completo (un foglio per area)</option>${S.aree.map(a => `<option value="inv:${esc(a)}">Solo area: ${esc(a)}</option>`).join("")}${anni.map(a => `<option value="acq:${a}">Einkauf ${a}</option>`).join("")}</select></div>
   <div class="hint">Stesso stile dei documenti originali: logo Robinson, colonne Gegenstand / Area / Rotto / Dismesso / In riparazione / Note / Quantità e menu a tendina sulle aree.</div>`, {
    ok: "Crea file", onOk: d => { const [t, ...r] = $("#eT", d).value.split(":"); const val = r.join(":"); $("#dok", d).disabled = true; creaExcel(t, val).then(() => d.close()).catch(e => { $("#derr", d).textContent = e instanceof Err ? e.message : "Errore: " + e.message; $("#dok", d).disabled = false; }); return false; }
  });
}

/* ---------- backup ---------- */
function dlgMenu() {
  dlg("Menu", `<div class="menu"><button class="btn dskonly" data-m="exp">Esporta Excel…</button><button class="btn" data-m="aree">Gestisci aree</button><button class="btn" data-m="bk">Scarica backup (JSON)</button><button class="btn" data-m="imp">Importa backup (JSON)…</button><button class="btn" data-m="nome">Cambia nome (${esc(Reg.nome() || "—")})</button>${Repo.mode === "cloud" ? '<button class="btn" data-m="out">Esci dall\'account</button>' : ""}<button class="btn dng" data-m="reset">Ripristina i dati iniziali…</button></div><div class="hint">${Repo.mode === "cloud" ? "I dati sono salvati nel database online e si aggiornano su ogni dispositivo." : "I dati sono salvati solo nel browser di questo dispositivo. Scarica un backup ogni tanto."}</div>`, {
    noCancel: true, init: d => {
      d.querySelector(".menu").onclick = e => {
        const b = e.target.closest("button"); if (!b) return; const m = b.dataset.m; d.close();
        if (m === "exp") dlgEsporta(); else if (m === "aree") dlgAree();
        else if (m === "bk") salvaFile("SL_backup_" + today() + ".json", new Blob([JSON.stringify(S, null, 1)], { type: "application/json" })).catch(er => toast(er.message));
        else if (m === "imp") $("#fileIn").click();
        else if (m === "nome") chiediNome(() => render(), false);
        else if (m === "out") Repo.logout().then(() => boot());
        else if (m === "reset") dlgConferma("Ripristina i dati iniziali", "Tutte le modifiche fatte da questo browser verranno sostituite dai dati di partenza (259 righe, 117 acquisti). Puoi annullare subito dopo.", "Ripristina", () => run(() => { S = Repo.fresh(); }, "Dati iniziali ripristinati."));
      };
    }
  });
  const e = $(".dskonly"); if (e) e.textContent = "Esporta Excel…";
}
$("#fileIn").onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.aree) || !Array.isArray(d.inv) || !Array.isArray(d.acq)) throw new Err("Il file non è un backup valido.");
    go(() => { S = fixS({ aree: d.aree, inv: d.inv, acq: d.acq, imgs: Array.isArray(d.imgs) ? d.imgs : [], imgv: d.imgv || {} }); }, "Backup importato.");
  } catch (e) { toast(e instanceof Err ? e.message : "Il file non è un backup valido."); }
};

/* ---------- eventi ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-area],[data-act],[data-gr]"); if (!t) return;
  if (t.dataset.tab) { closeDlg(); ui.tab = t.dataset.tab; render(); inCima(); return; }
  if (t.dataset.area != null) { ui.area = t.dataset.area; render(); return; }
  if (t.dataset.gr) { const g = Number(t.dataset.gr); ui.gr.has(g) ? ui.gr.delete(g) : ui.gr.add(g); render(); return; }
  const id = Number(t.dataset.id);
  switch (t.dataset.act) {
    case "newInv": dlgRiga(null); break;
    case "det": dlgDettaglio(id); break;
    case "detAcq": { const a = S.acq.find(x => x.id === id), r = a && invDiAcq(a); if (r) dlgDettaglio(r.id); else toast("Questo articolo non è ancora nell'inventario: usa «Collega»."); break; }
    case "editInv": dlgRiga(id); break;
    case "move": dlgSposta(id); break;
    case "stato": dlgStato(id); break;
    case "delInv": { const r = invRow(id); dlgConferma("Elimina articolo", `Eliminare «${esc(r.articolo)}» (${r.qty} pz, ${esc(r.area || "Da assegnare")}) dall'inventario? Gli acquisti collegati restano ma risulteranno non collegati.`, "Elimina", () => run(() => eliminaRiga(id), "Articolo eliminato.")); break; }
    case "altro": dlgAltro(); break;
    case "battPrel": dlgBatMov("prelievo"); break;
    case "battCar": dlgBatMov("carico"); break;
    case "battSog": dlgBatSoglie(); break;
    case "battExp": esportaBatterie().catch(er => toast(er.message || "Esportazione non riuscita.")); break;
    case "battDel": battElimina(id); break;
    case "showAdd": dlgShowAdd(); break;
    case "showOpen": dlgShowVedi(id); break;
    case "uni": dlgUnisci(t.dataset.k); break;
    case "uniIgn": { const s2 = ignUni(); s2.add(t.dataset.k); salvaIgnUni(s2); toast("Gruppo nascosto."); render(); break; }
    case "uniReset": salvaIgnUni(new Set()); render(); break;
    case "newAcq": dlgAcq(null); break;
    case "editAcq": dlgAcq(id); break;
    case "delAcq": { const a = S.acq.find(x => x.id === id); dlgConferma("Elimina acquisto", `Eliminare l'acquisto ${a.anno} di «${esc(a.articolo)}» (${a.qty} pz)? Le ${a.qty} unità verranno tolte anche dall'inventario collegato.`, "Elimina", () => run(() => delAcq(id), "Acquisto eliminato.")); break; }
    case "link": dlgCollega(id); break;
    case "linkAll": go(() => { const n = collegaTutti(); if (!n) throw new Err("Nessun collegamento automatico possibile: collega a mano."); }, "Acquisti collegati."); break;
    case "vedi": e.preventDefault(); ui.q = t.dataset.n; ui.area = "*"; ui.stato = ""; ui.tab = "inv"; render(); inCima(); break;
    case "fix": {
      if (t.dataset.d === "acq") { t.dataset.t === "NONCOLL" ? dlgCollega(id) : dlgAcq(id); }
      else if (t.dataset.t === "DOPPIA") go(() => { const r = invRow(id); const o = S.inv.find(x => x.id !== id && sameKey(x, r)); if (o) fuse(o); }, "Righe unite.");
      else dlgRiga(id);
      break;
    }
  }
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q") { ui.q = e.target.value; listInv(); }
  else if (id === "qa") { ui.qa = e.target.value; listAcq(); }
  else if (id === "qr") { ui.qr = e.target.value; listRie(); }
  else if (id === "qc") { ui.qc = e.target.value; listCon(); }
  else if (id === "qL") { ui2.ql = e.target.value; listLog(); }
  else if (id === "qB") { ui3.qb = e.target.value; listBat(); }
  else if (id === "qS") { ui3.qs = e.target.value; listShow(); }
});
document.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "fSt") { ui.stato = e.target.value; listInv(); }
  else if (id === "fAn") { ui.anno = e.target.value; listAcq(); }
  else if (id === "fBt") { ui3.bt = e.target.value; listBat(); }
  else if (id === "fSh") { ui3.sh = e.target.value; listShow(); }
  else if (id === "fLu") { ui2.lu = e.target.value; listLog(); }
  else if (id === "fLa") { ui2.la = e.target.value; listLog(); }
  else if (id === "areaSel") { ui.area = e.target.value; render(); }
});
const TEMI = ["", "light", "dark"], NOMI_TEMA = { "": "automatico (come il dispositivo)", light: "chiaro", dark: "scuro" }, ICO_TEMA = { "": "◐", light: "☀", dark: "☾" };
function temaCorrente() { try { return localStorage.getItem("sl_tema") || ""; } catch (e) { return ""; } }
function applicaTema(t) {
  const r = document.documentElement; if (t) r.dataset.theme = t; else delete r.dataset.theme;
  const i = $("#icTema"); if (i) i.textContent = ICO_TEMA[t];
}
applicaTema(temaCorrente());
$("#bTema").onclick = () => {
  const t = TEMI[(TEMI.indexOf(temaCorrente()) + 1) % TEMI.length];
  try { if (t) localStorage.setItem("sl_tema", t); else localStorage.removeItem("sl_tema"); } catch (e) {}
  applicaTema(t); toast("Tema " + NOMI_TEMA[t] + ".");
};
$("#bUndo").onclick = annulla; $("#bExp").onclick = dlgEsporta; $("#bAree").onclick = dlgAree; $("#bMenu").onclick = dlgMenu;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || "")) && !$("#dlg").open) { e.preventDefault(); annulla(); } });
/* ---------- aggiornamento automatico (altri dispositivi / app Windows) ---------- */
Repo.pull = async function (msg) {
  try { const r = await this.load(); if (r) { S = fixS(r); undo.length = 0; Img.cache.clear(); this.saveLocal(S); render(); if (msg) toast(msg); } }
  catch (e) { toast(e.message || "Aggiornamento non riuscito."); }
};
async function controllaRemoto() {
  if (Repo.mode !== "cloud" || !Repo.pwd() || Repo.busy || Repo.again || document.hidden || $("#dlg").open) return;
  try { const r = await Repo.call("GET", null, "?ver=1"); if (r.version !== Repo.ver && !Repo.busy && !$("#dlg").open) await Repo.pull("Dati aggiornati da un altro dispositivo."); }
  catch (e) {}
}
setInterval(controllaRemoto, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) controllaRemoto(); });
/* ---------- avvio ---------- */
const campoStile = 'style="width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)"';
const pulisciNome = v => { const n = String(v || "").trim().replace(/\s+/g, " "); if (n.length < 2) throw new Err("Scrivi il tuo nome (almeno 2 lettere): comparirà nel registro delle modifiche."); return n.slice(0, 40); };
function chiediAccesso() {
  const d = dlg("Accedi", `<div class="hint">Inventario Sound&amp;Light · Robinson Apulia</div><div class="f"><label for="lN">Il tuo nome</label><input type="text" id="lN" autocomplete="name" maxlength="40" value="${esc(Reg.nome())}" ${campoStile}></div><div class="f"><label for="lP">Password</label><input type="password" id="lP" autocomplete="current-password" name="password" ${campoStile}></div><div class="hint">Il nome serve per il registro: si vede chi aggiunge, modifica o elimina.</div>`, {
    ok: "Accedi", noCancel: true, onOk: d => {
      const nome = pulisciNome($("#lN", d).value);
      $("#dok", d).disabled = true;
      Repo.login(nome, $("#lP", d).value).then(() => { d.close(); boot(); }).catch(e => { $("#derr", d).textContent = e.message; $("#dok", d).disabled = false; });
      return false;
    }
  });
  $(".x", d).hidden = true; d.oncancel = e => e.preventDefault();
}
function chiediNome(dopo, obbligo) {
  const d = dlg(obbligo ? "Come ti chiami?" : "Cambia nome", `<div class="hint">Il tuo nome comparirà nel registro delle modifiche.</div><div class="f"><label for="lN">Nome</label><input type="text" id="lN" autocomplete="name" maxlength="40" value="${esc(Reg.nome())}" ${campoStile}></div>`, {
    ok: "Continua", noCancel: !!obbligo, onOk: d => { Reg.setNome(pulisciNome($("#lN", d).value)); toast("Ciao " + Reg.nome() + "!"); dopo && dopo(); }
  });
  if (obbligo) { $(".x", d).hidden = true; d.oncancel = e => e.preventDefault(); }
}
async function boot() {
  try {
    const m = await Repo.init();
    if (m === "login") { render(); return chiediAccesso(); }
    if (!Reg.nome()) { render(); return chiediNome(() => boot(), true); }
    const r = await Repo.load();
    if (r) S = fixS(r); else { S = Repo.fresh(); if (Repo.mode === "cloud") { await Repo.push(S); toast("Dati iniziali caricati nel database."); } }
    undo.length = 0; Repo.saveLocal(S); render();
    setStato(Repo.mode === "cloud" ? "Cloud collegato" : "Solo questo browser", false);
    Batt.carica().then(() => { render(); const b = battBassi(); if (b.length) toast("⚠ Scorte batterie in esaurimento: " + txtBassi(b)); });
  } catch (e) { render(); toast(e.message || "Errore di avvio"); setStato("Errore", true); }
}
S = fixS(Repo.loadLocal() || Repo.fresh()); render(); boot();
</script>
